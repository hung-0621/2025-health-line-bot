<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康評估</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class='title'>健康評估</h1>

        <nav class="navbar">
            <button id="nav-個人資料" class="nav-btn active">個人資料</button>
            <button id="nav-飲食篇" class="nav-btn">飲食篇</button>
            <button id="nav-生活篇" class="nav-btn">生活篇</button>
            <button id="nav-心理篇" class="nav-btn">心理篇</button>
        </nav>

        <main id="content-area">
            <!-- 初始內容會由 JS 載入 -->
        </main>

        <div class="action-area">
            <button type="button" id="prev-btn">上一步</button>
            <button type="button" id="next-btn">下一步</button>
            <button type="button" id="submit-btn">完成並提交</button>
            <p id="status-message"></p>
        </div>
    </div>

    <script>
        window.LIFF_ID = {{ liff_id | tojson }};
    </script>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="{{ url_for('static', filename='js/form.js') }}"></script>
</body>
</html>
